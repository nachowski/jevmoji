<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jevmoji</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding-top: 12vh;
         background: #161616; font-family: -apple-system, system-ui, sans-serif; color: #eee; }
  .picker { width: 540px; max-width: calc(100vw - 32px); background: #232323; border: 1px solid #333;
            border-radius: 14px; box-shadow: 0 12px 40px #0008; overflow: hidden; }
  .bar { position: relative; display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #333; }
  input { flex: 1; background: none; border: 0; outline: 0; color: inherit; font-size: 22px; }
  .clear { background: none; border: 0; color: #999; font-size: 22px; cursor: pointer; transition: opacity .2s; }
  input:placeholder-shown ~ .clear { opacity: 0; pointer-events: none; }
  .meta { color: #777; font-size: 13px; font-variant-numeric: tabular-nums; margin-right: 12px;
          transition: opacity .25s, transform .25s; }
  .meta:empty { opacity: 0; transform: translateY(4px); }

  /* loading: a thin sweep along the bottom of the search bar */
  .bar::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: 30%;
                background: linear-gradient(90deg, transparent, #7fbf6a, transparent);
                opacity: 0; transition: opacity .2s; }
  .loading .bar::after { opacity: 1; animation: sweep 1s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(430%); } }
  /* streaming: a solid fill for the share of Jev requests already in (--progress = 0..1) */
  .bar::before { content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%;
                 background: #7fbf6a55; transform-origin: left; transform: scaleX(var(--progress, 0));
                 opacity: 0; transition: opacity .4s; }
  .loading .bar::before { opacity: 1; transition: transform .3s ease, opacity .4s; }

  .body { padding: 0 20px; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease, padding .3s; }
  .body.open { grid-template-rows: 1fr; padding: 14px 20px 18px; }
  .grid { display: flex; flex-wrap: wrap; gap: 2px; overflow: hidden; transition: opacity .2s; }
  .loading:not(.streaming) .grid { opacity: .35; }  /* dim stale hits until this query's first chunk lands */
  .grid button { font-size: 32px; width: 52px; height: 52px; border: 0; border-radius: 10px; background: none;
                 cursor: pointer; transition: background .15s, transform .15s; }
  .grid button.new { animation: pop .28s cubic-bezier(.3,1.5,.6,1) backwards; }
  .grid button:hover, .grid button:first-child { background: #2e3a2a; }
  .grid button:active { transform: scale(.88); }
  .grid button.copied { animation: bump .35s ease; }
  /* Jev's yes-probability as 5 faint segments under each emoji (--lit = 1..5) */
  .grid button { position: relative; }
  .grid button::after { content: ""; position: absolute; left: 14px; bottom: 5px; width: 24px; height: 2px;
                        background: linear-gradient(90deg, #fff calc(var(--lit) * 20%), #fff4 0);
                        -webkit-mask: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 5px);
                        mask: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 5px);
                        opacity: .25; transition: opacity .15s; }
  .grid button:hover::after { opacity: .5; }
  .empty { color: #777; padding-left: 12px; animation: pop .25s ease backwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  @keyframes bump { 40% { transform: scale(1.25); } }

  .picked { text-align: center; margin-top: 20px; color: #999; transition: opacity .3s, transform .3s; }
  .picked:empty, .picked.hide { opacity: 0; transform: translateY(-6px); }
</style>
</head>
<body>
<div>
  <div class="picker" id="picker">
    <div class="bar">
      <input id="q" placeholder="Search emoji…" autofocus autocomplete="off">
      <span class="meta" id="meta"></span>
      <button class="clear" id="clear" aria-label="Clear">✕</button>
    </div>
    <div class="body" id="body"><div class="grid" id="grid"></div></div>
  </div>
  <div class="picked" id="picked"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const q = $("q"), picker = $("picker"), body = $("body"), grid = $("grid"), meta = $("meta"), picked = $("picked");
let timer, controller;

function hidePicked() {
  picked.classList.add("hide");
}

function button(h) {
  const b = document.createElement("button");
  b.textContent = h.e;
  b.title = `${h.n} — ${Math.round(h.p * 100)}%`;
  // 5 buckets across the shown range: 0.5–0.6 → 1 segment … 0.9–1.0 → 5 (server THRESHOLD is 0.5)
  b.style.setProperty("--lit", Math.min(5, Math.max(1, Math.floor((h.p - 0.5) * 10) + 1)));
  b.onclick = () => {
    navigator.clipboard?.writeText(h.e);
    b.classList.remove("copied"); void b.offsetWidth; b.classList.add("copied");
    picked.classList.remove("hide");
    picked.textContent = `Copied ${h.e} ${h.n}`;
  };
  return b;
}

// Keyed re-render: emoji already on screen glide to their new slot (FLIP), newcomers pop in.
function render(hits, final) {
  if (!hits.length && !final) return;  // nothing yet; keep waiting for more chunks
  const old = new Map([...grid.querySelectorAll("button")].map((b) => [b.dataset.e, b]));
  const before = new Map([...old].map(([e, b]) => [e, b.getBoundingClientRect()]));
  let fresh = 0;
  const next = hits.map((h) => {
    const b = old.get(h.e) ?? button(h);
    b.dataset.e = h.e;
    if (!old.has(h.e)) {
      b.classList.add("new");
      b.style.animationDelay = `${fresh++ * 12}ms`;
      b.onanimationend = () => b.classList.remove("new");
    }
    return b;
  });
  grid.replaceChildren(...next);
  if (!hits.length) grid.innerHTML = '<div class="empty">No match</div>';
  for (const b of next) {
    const r = before.get(b.dataset.e);
    if (!r) continue;
    const now = b.getBoundingClientRect();
    const dx = r.left - now.left, dy = r.top - now.top;
    if (dx || dy) b.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
                            { duration: 320, easing: "cubic-bezier(.3,1.25,.6,1)" });
  }
  body.classList.add("open");
}

async function search(query) {
  controller?.abort();
  if (!query.trim()) {
    picker.classList.remove("loading"); body.classList.remove("open"); meta.textContent = "";
    return;
  }
  controller = new AbortController();
  picker.classList.remove("streaming");
  picker.style.setProperty("--progress", 0);
  void picker.offsetWidth;  // commit the reset before .loading turns the fill's transition on
  picker.classList.add("loading");
  meta.textContent = "";
  const t0 = performance.now();
  try {
    const res = await fetch("/search", { method: "POST", signal: controller.signal,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query }) });
    // NDJSON: one line per finished Jev request, each carrying the running top hits
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (let eof = false; !eof;) {
      const { value, done } = await reader.read();
      eof = done;
      buf += value ?? "";
      const lines = buf.split("\n");
      buf = eof ? "" : lines.pop();  // hold back a partial line until the rest arrives
      for (const line of lines.filter(Boolean)) {
        const { hits, tokens, usd, done, total } = JSON.parse(line);
        const final = done === total;
        render(hits, final);
        if (hits.length) picker.classList.add("streaming");
        picker.style.setProperty("--progress", done / total);
        const ms = Math.round(performance.now() - t0);
        meta.textContent = final ? `${ms} ms · $${usd.toFixed(4)}` : `${done}/${total} · ${ms} ms`;
        meta.title = `${tokens.toLocaleString()} input tokens`;
      }
    }
  } catch (e) {
    if (e.name === "AbortError") return;
    meta.textContent = "error";
  }
  picker.classList.remove("loading", "streaming");
}

q.oninput = () => {
  hidePicked();
  clearTimeout(timer);
  timer = setTimeout(() => search(q.value), 250);
};
$("clear").onclick = () => { q.value = ""; hidePicked(); search(""); q.focus(); };
</script>
</body>
</html>
